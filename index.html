<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMAX INTELLIGENCE v64.0 | Elite Sports Analytics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#12121a;--card:#1a1a2e;--gold:#ffd700;--green:#00ff88;--text:#fff;--muted:#a0a0b0;--border:rgba(255,255,255,0.08)}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);color:#fff;min-height:100vh;line-height:1.6}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes goldPulse{0%,100%{box-shadow:0 0 20px rgba(255,215,0,0.4)}50%{box-shadow:0 0 40px rgba(255,215,0,0.8)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes diamondFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
.elite-frame{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999}
.elite-frame::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:3px solid transparent;background:linear-gradient(90deg,#ffd700,#b8860b,#ffd700) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:goldPulse 3s ease-in-out infinite}
.corner{position:fixed;width:50px;height:50px;z-index:10000;pointer-events:none;font-size:24px;display:flex;align-items:center;justify-content:center}
.corner::before{content:'💎';animation:goldPulse 2s infinite}
.corner-tl{top:15px;left:15px}.corner-tr{top:15px;right:15px}.corner-bl{bottom:15px;left:15px}.corner-br{bottom:15px;right:15px}
.diamond-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9998;overflow:hidden}
.diamond-star{position:absolute;animation:diamondFall linear infinite;opacity:0.6}
header{background:linear-gradient(180deg,rgba(10,10,15,0.98),rgba(26,26,46,0.95));border-bottom:2px solid #ffd700;padding:20px;position:sticky;top:0;z-index:1000;backdrop-filter:blur(20px)}
.header-content{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ffd700,#b8860b,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:goldPulse 3s infinite}
.badge{background:linear-gradient(135deg,#ffd700,#b8860b);color:#000;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700}
.stats{display:flex;gap:15px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 20px;text-align:center}
.stat-val{font-size:1.4rem;font-weight:700;color:var(--gold);font-family:monospace}
.stat-lbl{font-size:0.7rem;color:var(--muted);text-transform:uppercase}
.controls{display:flex;gap:10px;flex-wrap:wrap}
select{background:var(--card);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:10px 15px;cursor:pointer}
select:focus{outline:none;box-shadow:0 0 15px rgba(255,215,0,0.3)}
nav{display:flex;justify-content:center;gap:5px;padding:15px;background:var(--bg2);flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;color:var(--muted);cursor:pointer;font-weight:600;transition:all 0.3s}
.tab:hover{color:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.tab.active{background:linear-gradient(135deg,#ffd700,#b8860b);color:#000;border-color:var(--gold);box-shadow:0 0 25px rgba(255,215,0,0.5)}
main{max-width:1400px;margin:0 auto;padding:30px 20px}
.content{display:none;animation:fadeIn 0.5s}
.content.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:25px;margin-bottom:20px;animation:fadeIn 0.5s}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.card-title{font-size:1.3rem;font-weight:700;margin-bottom:15px;color:var(--gold)}
.countdown-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:30px}
.countdown{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:20px;text-align:center;animation:goldPulse 3s infinite}
.countdown-event{font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:5px;text-transform:uppercase}
.countdown-sub{font-size:0.9rem;color:var(--muted);margin-bottom:15px}
.timer{display:flex;justify-content:center;gap:10px}
.time-box{background:#0a0a0f;border:1px solid var(--gold);border-radius:10px;padding:10px 15px;min-width:60px}
.time-val{font-size:1.8rem;font-weight:800;color:var(--gold);font-family:monospace}
.time-lbl{font-size:0.65rem;color:var(--muted);text-transform:uppercase}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:25px;text-align:center}
.stat-card:hover{border-color:var(--gold);transform:translateY(-5px)}
.stat-big{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#ffd700,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pick{background:linear-gradient(135deg,var(--card),#252540);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:15px;border-left:4px solid var(--gold)}
.pick:hover{transform:translateX(5px);border-color:var(--gold)}
.pick-num{background:linear-gradient(135deg,#ffd700,#b8860b);color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.pick-team{font-size:1.2rem;font-weight:700;margin-bottom:5px}
.pick-odds{background:var(--bg2);padding:4px 12px;border-radius:6px;font-family:monospace;color:var(--gold)}
.status{padding:4px 12px;border-radius:6px;font-weight:600;font-size:0.8rem}
.win{background:rgba(0,255,136,0.2);color:#00ff88;border:1px solid #00ff88}
.pending{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid #ffd700}
.live{background:rgba(255,0,0,0.2);color:#ff4444;border:1px solid #ff4444;animation:goldPulse 1s infinite}
.alert{background:var(--card);border-left:4px solid;border-radius:12px;padding:18px 20px;margin-bottom:12px;display:flex;gap:15px;animation:fadeIn 0.5s}
.alert-live{border-color:#ff4444}.alert-result{border-color:#00ff88}.alert-upcoming{border-color:#ffd700}.alert-news{border-color:#00d4ff}
table{width:100%;border-collapse:collapse;font-size:0.9rem}
th{background:var(--bg2);color:var(--gold);padding:15px;text-align:left;font-weight:700;text-transform:uppercase}
td{padding:15px;border-bottom:1px solid var(--border)}
tr:hover td{background:#252540}
.parlay-container{display:grid;grid-template-columns:1fr 350px;gap:30px}
@media(max-width:900px){.parlay-container{grid-template-columns:1fr}}
.parlay-slip{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:25px;position:sticky;top:100px}
.parlay-title{font-size:1.3rem;font-weight:800;color:var(--gold);text-align:center;margin-bottom:20px}
.parlay-leg{background:var(--bg2);border-radius:10px;padding:12px 15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:15px 30px;border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:all 0.3s;text-transform:uppercase}
.btn-gold{background:linear-gradient(135deg,#ffd700,#b8860b);color:#000;width:100%;margin-top:15px}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,215,0,0.4)}
.btn-sm{padding:8px 15px;font-size:0.8rem}
input[type="number"]{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:15px;color:#fff;font-size:1.1rem;text-align:center;margin:15px 0}
input:focus{outline:none;border-color:var(--gold)}
.payout{text-align:center;padding:20px;background:var(--bg2);border-radius:12px;margin-top:15px}
.payout-val{font-size:2rem;font-weight:800;color:var(--gold);font-family:monospace}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:25px}
.chart-title{font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:20px;text-align:center}
.donut{width:200px;height:200px;margin:0 auto;position:relative}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-pct{font-size:2.5rem;font-weight:800;color:var(--gold);font-family:monospace}
.bar-chart{height:200px;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;padding:10px 0}
.bar-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.bar{width:100%;max-width:50px;background:linear-gradient(135deg,#ffd700,#b8860b);border-radius:6px 6px 0 0}
footer{background:var(--bg2);border-top:2px solid var(--gold);padding:40px 20px;margin-top:50px}
.footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;max-width:1400px;margin:0 auto}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr}.header-content{flex-direction:column;text-align:center}.parlay-container{grid-template-columns:1fr}}
.footer-section h3{color:var(--gold);margin-bottom:15px}
.footer-section p{color:var(--muted);font-size:0.85rem;line-height:1.7}
.footer-bottom{text-align:center;margin-top:30px;padding-top:30px;border-top:1px solid var(--border)}
/* 49 FIFA Themes */
.theme-usa{--theme:#002868}.theme-mexico{--theme:#006847}.theme-canada{--theme:#ff0000}.theme-panama{--theme:#da121a}.theme-curacao{--theme:#002b7f}.theme-haiti{--theme:#00209f}
.theme-argentina{--theme:#75aadb}.theme-brazil{--theme:#009739}.theme-uruguay{--theme:#0038a8}.theme-colombia{--theme:#fcd116}.theme-ecuador{--theme:#ffd100}.theme-paraguay{--theme:#d52b1e}
.theme-france{--theme:#002395}.theme-germany{--theme:#000}.theme-spain{--theme:#c60b1e}.theme-portugal{--theme:#006600}.theme-netherlands{--theme:#ff6600}.theme-belgium{--theme:#000}
.theme-italy{--theme:#0066cc}.theme-england{--theme:#fff}.theme-switzerland{--theme:#ff0000}.theme-denmark{--theme:#c8102e}.theme-austria{--theme:#ed2939}.theme-serbia{--theme:#c6363c}
.theme-ukraine{--theme:#005bbb}.theme-croatia{--theme:#ff0000}.theme-slovenia{--theme:#005da4}.theme-bosnia{--theme:#002395}
.theme-morocco{--theme:#c1272d}.theme-senegal{--theme:#00853f}.theme-nigeria{--theme:#008751}.theme-ghana{--theme:#006b3f}.theme-cameroon{--theme:#007a5e}.theme-south-africa{--theme:#007a4d}
.theme-ivory-coast{--theme:#ff9933}.theme-algeria{--theme:#006633}.theme-tunisia{--theme:#e70013}.theme-cape-verde{--theme:#003893}
.theme-japan{--theme:#bc002d}.theme-south-korea{--theme:#cd2e3a}.theme-australia{--theme:#00843d}.theme-saudi-arabia{--theme:#006c35}.theme-iran{--theme:#239f40}.theme-qatar{--theme:#8d1b3d}
.theme-uzbekistan{--theme:#0099b5}.theme-jordan{--theme:#000}.theme-iraq{--theme:#007a3d}.theme-new-zealand{--theme:#000}.theme-fifa{--theme:#ffd700}
</style>
</head>
