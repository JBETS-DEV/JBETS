/* Core Reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }

/* Glass Card */
.glass-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; transition: 0.3s ease; }
.glass-card:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(212,175,55,0.2); border-color: rgba(212,175,55,0.3); }

/* Header */
.header { position: sticky; top: 0; z-index: 1000; background: linear-gradient(180deg, rgba(5,8,16,0.98) 0%, rgba(5,8,16,0.95) 100%); backdrop-filter: blur(20px); border-bottom: 0.5px solid rgba(212,175,55,0.2); padding: 12px 20px; }
.header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; gap: 12px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 40px; height: 40px; background: var(--gradient-gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.logo-text { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.control-select { background: rgba(255,255,255,0.05); border: 0.5px solid rgba(212,175,55,0.3); border-radius: 8px; padding: 8px 12px; color: var(--text-primary); font-size: 13px; cursor: pointer; }
.control-select:hover { border-color: var(--gold); }
.control-select option { background: var(--bg-secondary); color: var(--text-primary); }
.live-badge { background: var(--red); color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; animation: livePulse 1.5s infinite; }
@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.live-dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: blink 1s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Navigation - 10 Tabs */
.nav-tabs { display: flex; justify-content: center; gap: 4px; padding: 12px 20px; background: rgba(5,8,16,0.9); border-bottom: 0.5px solid rgba(255,255,255,0.05); flex-wrap: wrap; }
.nav-tab { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: 0.5px solid transparent; cursor: pointer; transition: 0.3s ease; display: flex; align-items: center; gap: 6px; }
.nav-tab:hover { color: var(--gold); background: rgba(212,175,55,0.1); }
.nav-tab.active { color: var(--gold); background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.3); font-weight: 600; }

/* Container & Sections */
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.section { display: none; animation: fadeIn 0.3s ease-out; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 0.5px solid rgba(212,175,55,0.2); }
.section-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 20px; text-align: center; }
.stat-value { font-size: 32px; font-weight: 800; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-value.green { color: var(--green); background: none; -webkit-text-fill-color: var(--green); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

/* Countdown */
.countdown-container { background: linear-gradient(135deg, rgba(212,175,55,0.1) 0%, rgba(212,175,55,0.02) 100%); border: 0.5px solid rgba(212,175,55,0.3); border-radius: 16px; padding: 24px; margin-bottom: 24px; text-align: center; }
.countdown-title { font-size: 14px; color: var(--gold); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 2px; }
.countdown-timer { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
.countdown-item { display: flex; flex-direction: column; align-items: center; }
.countdown-num { font-size: 48px; font-weight: 900; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; min-width: 80px; }
.countdown-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }

/* Pick Cards */
.picks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.pick-card { background: var(--bg-card); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; position: relative; overflow: hidden; }
.pick-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-gold); }
.pick-card.win::before { background: var(--green); }
.pick-card.loss::before { background: var(--red); }
.pick-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.pick-sport { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
.pick-time { font-size: 11px; color: var(--text-muted); }
.pick-matchup { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.pick-selection { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(212,175,55,0.1); border-radius: 8px; margin-bottom: 12px; }
.pick-team { font-weight: 600; flex: 1; }
.pick-odds { font-weight: 700; color: var(--gold); font-size: 16px; }
.pick-conf { display: flex; align-items: center; gap: 8px; }
.conf-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.conf-fill { height: 100%; background: var(--gradient-gold); border-radius: 3px; }
.conf-text { font-size: 13px; font-weight: 600; color: var(--gold); min-width: 40px; }
.pick-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.08); }
.pick-result { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
.pick-result.win { background: rgba(16,185,129,0.2); color: var(--green); }
.pick-result.loss { background: rgba(239,68,68,0.2); color: var(--red); }
.pick-result.pending { background: rgba(212,175,55,0.2); color: var(--gold); }

/* Parlay Builder */
.parlay-builder { background: var(--bg-card); border: 0.5px solid rgba(212,175,55,0.3); border-radius: 16px; padding: 20px; }
.parlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
.parlay-title { font-size: 18px; font-weight: 700; color: var(--gold); }
.parlay-count { background: var(--gold); color: var(--bg-primary); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.parlay-legs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.parlay-leg { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 0.5px solid rgba(255,255,255,0.05); }
.leg-info { flex: 1; }
.leg-pick { font-weight: 600; margin-bottom: 2px; }
.leg-game { font-size: 12px; color: var(--text-muted); }
.leg-odds { font-weight: 700; color: var(--gold); }
.leg-remove { width: 24px; height: 24px; border-radius: 50%; background: rgba(239,68,68,0.2); color: var(--red); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 12px; }
.parlay-summary { background: rgba(212,175,55,0.1); border-radius: 12px; padding: 16px; }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
.summary-label { color: var(--text-secondary); }
.summary-value { font-weight: 600; }
.summary-value.total { font-size: 24px; color: var(--gold); }
.parlay-actions { display: flex; gap: 12px; margin-top: 16px; }
.btn-parlay { flex: 1; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s ease; border: none; }
.btn-parlay.primary { background: var(--gradient-gold); color: var(--bg-primary); }
.btn-parlay.secondary { background: rgba(255,255,255,0.05); color: var(--text-primary); border: 0.5px solid rgba(255,255,255,0.1); }
.btn-add-parlay { background: rgba(212,175,55,0.15); border: 1px dashed rgba(212,175,55,0.5); color: var(--gold); padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.3s ease; }

// ════════════════════════════════════════════════════════════════════════════
// 🔥 FIXED TAB SWITCHING — THE MAIN BUG FIX
// ════════════════════════════════════════════════════════════════════════════
function switchTab(tabId) {
    // Hide ALL sections
    document.querySelectorAll('.section').forEach(s => {
        s.classList.remove('active');
    });
    
    // Remove active from ALL tabs
    document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.remove('active');
    });
    
    // Show the target section — FIXED: use tabId directly, NOT tabId + '-section'
    const section = document.getElementById(tabId);
    if (section) {
        section.classList.add('active');
    }
    
    // Activate the clicked tab
    const tab = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
    if (tab) {
        tab.classList.add('active');
    }
    
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // Initialize charts if on elite tab
    if (tabId === 'elite') {
        setTimeout(initCharts, 100);
    }
}

// ════════════════════════════════════════════════════════════════════════════
// 🎨 THEME SYSTEM — 49 FIFA WC2026 THEMES + Light Mode
// ════════════════════════════════════════════════════════════════════════════
function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('sigmax-theme', theme);
    
    // Celebration for certain themes
    if (['brazil', 'argentina', 'france', 'usa'].includes(theme) && typeof confetti !== 'undefined') {
        confetti({ particleCount: 30, spread: 60, origin: { y: 0.3 } });
    }
}

// ════════════════════════════════════════════════════════════════════════════
// 📱 DEVICE MODE SYSTEM
// ════════════════════════════════════════════════════════════════════════════
function setDevice(device) {
    document.documentElement.setAttribute('data-device', device);
    localStorage.setItem('sigmax-device', device);
}

// Auto-detect device
function detectDevice() {
    const w = window.innerWidth;
    if (w < 576) return 'mobile';
    if (w < 768) return 'tablet';
    if (w < 1200) return 'laptop';
    return 'desktop';
}

// ════════════════════════════════════════════════════════════════════════════
// 🌐 INTERNATIONALIZATION — 9 LANGUAGES
// ════════════════════════════════════════════════════════════════════════════
const translations = {
    en: { home: 'Home', alerts: 'Alerts', top5: 'Top 5', props: 'Props', games: 'Games', xfactors: 'X-Factors', journal: 'Journal', parlay: 'Parlay', elite: 'Elite', index: 'Index', todaysPicks: "Today's Picks", countdown: 'Countdown to First Game', record: 'Record', bankroll: 'Bankroll', roi: 'ROI', streak: 'Streak' },
    es: { home: 'Inicio', alerts: 'Alertas', top5: 'Top 5', props: 'Props', games: 'Juegos', xfactors: 'X-Factores', journal: 'Diario', parlay: 'Parlay', elite: 'Élite', index: 'Índice', todaysPicks: 'Picks de Hoy', countdown: 'Cuenta Regresiva', record: 'Récord', bankroll: 'Capital', roi: 'ROI', streak: 'Racha' },

    pt: { home: 'Início', alerts: 'Alertas', top5: 'Top 5', props: 'Props', games: 'Jogos', xfactors: 'X-Fatores', journal: 'Diário', parlay: 'Parlay', elite: 'Elite', index: 'Índice', todaysPicks: 'Picks de Hoje', countdown: 'Contagem Regressiva', record: 'Recorde', bankroll: 'Banca', roi: 'ROI', streak: 'Sequência' },

    zh: { home: '首页', alerts: '提醒', top5: '前五', props: '球员数据', games: '比赛', xfactors: 'X因素', journal: '日志', parlay: '串关', elite: '精英', index: '索引', todaysPicks: '今日精选', countdown: '倒计时', record: '战绩', bankroll: '资金', roi: '回报率', streak: '连胜' },

let currentLang = 'en';

function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.setAttribute('data-lang', lang);
    localStorage.setItem('sigmax-lang', lang);
    
    // Update all elements with data-i18n
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
            el.textContent = translations[lang][key];
        }
    });
    
    // Update tab labels
    document.querySelectorAll('.nav-tab').forEach(tab => {
        const tabId = tab.getAttribute('data-tab');
        if (translations[lang] && translations[lang][tabId]) {
            const emoji = tab.textContent.split(' ')[0];
            tab.innerHTML = emoji + ' ' + translations[lang][tabId];
        }
    });
}

// ════════════════════════════════════════════════════════════════════════════
// 🎰 PARLAY BUILDER — Full Parlay System
// ════════════════════════════════════════════════════════════════════════════
let parlayLegs = [];
const MAX_LEGS = 10;

function addToParlay(pick, game, odds) {
    if (parlayLegs.length >= MAX_LEGS) {
        alert('Maximum ' + MAX_LEGS + ' legs allowed!');
        return;
    }
    
    // Check for duplicate
    const exists = parlayLegs.some(leg => leg.pick === pick && leg.game === game);
    if (exists) {
        alert('This pick is already in your parlay!');
        return;
    }
    
    parlayLegs.push({ pick, game, odds: parseFloat(odds) });
    updateParlayDisplay();
    
    // Celebration
    if (typeof confetti !== 'undefined') {
        confetti({ particleCount: 15, spread: 40, origin: { y: 0.7 } });
    }
}

function removeLeg(index) {
    parlayLegs.splice(index, 1);
    updateParlayDisplay();
}

function clearParlay() {
    parlayLegs = [];
    updateParlayDisplay();
}

function updateParlayDisplay() {
    const container = document.getElementById('parlayLegs');
    const countEl = document.getElementById('parlayCount');
    const totalOddsEl = document.getElementById('totalOdds');
    const payoutEl = document.getElementById('potentialPayout');
    
    if (!container) return;
    
    countEl.textContent = parlayLegs.length + ' Legs';
    
    if (parlayLegs.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Add picks to build your parlay</div>';
        totalOddsEl.textContent = '+100';
        payoutEl.textContent = '$0.00';
        return;
    }
    
    // Calculate total odds
    let totalDecimal = 1;
    parlayLegs.forEach(leg => {
        const decimal = leg.odds > 0 ? (leg.odds / 100) + 1 : (100 / Math.abs(leg.odds)) + 1;
        totalDecimal *= decimal;
    });
    
    const americanOdds = totalDecimal >= 2 ? '+' + Math.round((totalDecimal - 1) * 100) : '-' + Math.round(100 / (totalDecimal - 1));
    const payout = (100 * totalDecimal).toFixed(2);
    
    totalOddsEl.textContent = americanOdds;
    payoutEl.textContent = '$' + payout;
    
    // Render legs
    container.innerHTML = parlayLegs.map((leg, i) => `
        <div class="parlay-leg">
            <div class="leg-info">
                <div class="leg-pick">${leg.pick}</div>
                <div class="leg-game">${leg.game}</div>
            </div>
            <div class="leg-odds">${leg.odds > 0 ? '+' : ''}${leg.odds}</div>
            <button class="leg-remove" onclick="removeLeg(${i})">×</button>
        </div>
    `).join('');
}

function copyParlay() {
    if (parlayLegs.length === 0) {
        alert('Add legs to your parlay first!');
        return;
    }
    
    const text = '🎰 SigMAX PARLAY\n' + parlayLegs.map(l => `• ${l.pick} (${l.odds > 0 ? '+' : ''}${l.odds})\n  ${l.game}`).join('\n') + '\n\n📡 Built with SigMAX ELITE v55.0';
    
    navigator.clipboard.writeText(text).then(() => {
        alert('Parlay copied to clipboard!');
    });
}

// ════════════════════════════════════════════════════════════════════════════
// ⏱️ COUNTDOWN TIMER
// ════════════════════════════════════════════════════════════════════════════
function updateCountdown() {
    const target = new Date();
    target.setHours(19, 0, 0, 0); // 7:00 PM
    if (new Date() > target) target.setDate(target.getDate() + 1);
    
    const diff = target - new Date();
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    const hEl = document.getElementById('countHours');
    const mEl = document.getElementById('countMinutes');
    const sEl = document.getElementById('countSeconds');
    
    if (hEl) hEl.textContent = String(hours).padStart(2, '0');
    if (mEl) mEl.textContent = String(minutes).padStart(2, '0');
    if (sEl) sEl.textContent = String(seconds).padStart(2, '0');
}

// ════════════════════════════════════════════════════════════════════════════
// 📊 CHART.JS INITIALIZATION
// ════════════════════════════════════════════════════════════════════════════

function initCharts() {

    chartsInitialized = true;
    
    const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: 'rgba(255,255,255,0.7)' } } },
        scales: { x: { ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { color: 'rgba(255,255,255,0.05)' } }, y: { ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { color: 'rgba(255,255,255,0.05)' } } }
    };
    
    // Bankroll Chart
    const bankrollCtx = document.getElementById('bankrollChart');

                    { label: 'Wins', data: [45, 52, 48, 55, 50, 45], backgroundColor: '#10b981' },

    // Confidence Chart
    const confCtx = document.getElementById('confChart');

        new Chart(confCtx, {

                    label: 'Picks',

                        {x: 65, y: 72}, {x: 70, y: 78}, {x: 75, y: 82}, {x: 80, y: 85}, {x: 85, y: 89}, {x: 90, y: 94}

            options: chartOptions
        });

}

// ════════════════════════════════════════════════════════════════════════════

    if (themeSelect) themeSelect.value = savedTheme;
    if (deviceSelect) deviceSelect.value = savedDevice;
    if (langSelect) langSelect.value = savedLang;
    
    // Show home tab by default
    switchTab('home');
    
    // Start countdown
    updateCountdown();
    setInterval(updateCountdown, 1000);
    
    // Initialize parlay display
    updateParlayDisplay();
    
    console.log('📡 SigMAX ELITE v55.0 initialized successfully!');
    console.log('✅ FIXED: Tab switching now works correctly');
});
