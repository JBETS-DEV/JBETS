<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Countdown Test</title>
<style>
body{font-family:Arial,sans-serif;background:#080b12;color:#fff;padding:20px}
.countdown-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:0 auto}
.countdown-box{background:rgba(20,25,35,0.95);border:2px solid #d4af37;border-radius:16px;padding:20px;text-align:center}
.countdown-label{color:#d4af37;font-size:14px;margin-bottom:8px}
.countdown-event{font-size:18px;font-weight:bold;margin-bottom:16px}
.countdown-timer{display:flex;justify-content:center;gap:20px}
.countdown-unit{text-align:center}
.countdown-value{font-size:36px;font-weight:900;color:#d4af37;display:block}
.countdown-sublabel{font-size:12px;color:#888}
.countdown-time{margin-top:12px;font-size:12px;color:#888}
h1{text-align:center;color:#d4af37;margin-bottom:30px}
.debug{background:#1a1a2e;padding:10px;margin-top:20px;border-radius:8px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<h1>🧪 COUNTDOWN TEST — June 3, 2026</h1>

<div class="countdown-grid">
<div class="countdown-box">
<div class="countdown-label">🏀 NBA FINALS GAME 1</div>
<div class="countdown-event">NYK Knicks @ SAS Spurs</div>
<div class="countdown-timer">
<div class="countdown-unit"><span class="countdown-value" id="nba-hours">--</span><span class="countdown-sublabel">HRS</span></div>
<div class="countdown-unit"><span class="countdown-value" id="nba-mins">--</span><span class="countdown-sublabel">MIN</span></div>
<div class="countdown-unit"><span class="countdown-value" id="nba-secs">--</span><span class="countdown-sublabel">SEC</span></div>
</div>
<div class="countdown-time">Tonight 8:30 PM ET</div>
</div>

<div class="countdown-box">
<div class="countdown-label">🏒 STANLEY CUP FINALS G2</div>
<div class="countdown-event">VGK @ CAR Hurricanes</div>
<div class="countdown-timer">
<div class="countdown-unit"><span class="countdown-value" id="nhl-hours">--</span><span class="countdown-sublabel">HRS</span></div>
<div class="countdown-unit"><span class="countdown-value" id="nhl-mins">--</span><span class="countdown-sublabel">MIN</span></div>
<div class="countdown-unit"><span class="countdown-value" id="nhl-secs">--</span><span class="countdown-sublabel">SEC</span></div>
</div>
<div class="countdown-time">Thu Jun 5, 8:00 PM ET</div>
</div>

<div class="countdown-box">
<div class="countdown-label">🎾 FRENCH OPEN SF</div>
<div class="countdown-event">Zverev vs Mensik</div>
<div class="countdown-timer">
<div class="countdown-unit"><span class="countdown-value" id="fo-hours">--</span><span class="countdown-sublabel">HRS</span></div>
<div class="countdown-unit"><span class="countdown-value" id="fo-mins">--</span><span class="countdown-sublabel">MIN</span></div>
<div class="countdown-unit"><span class="countdown-value" id="fo-secs">--</span><span class="countdown-sublabel">SEC</span></div>
</div>
<div class="countdown-time">Fri Jun 6, 9:00 AM ET</div>
</div>
</div>

<div class="debug" id="debug">Loading...</div>

<script>
const countdownEvents = [
{ id: 'nba', target: new Date('2026-06-03T20:30:00-04:00'), name: 'NBA Finals G1' },
{ id: 'nhl', target: new Date('2026-06-05T20:00:00-04:00'), name: 'Stanley Cup G2' },
{ id: 'fo', target: new Date('2026-06-06T09:00:00-04:00'), name: 'French Open SF' }
];

function updateCountdowns() {
const now = new Date();
let debugInfo = 'Current time: ' + now.toLocaleString() + '<br>';

countdownEvents.forEach(event => {
const hoursEl = document.getElementById(event.id + '-hours');
const minutesEl = document.getElementById(event.id + '-mins');
const secondsEl = document.getElementById(event.id + '-secs');

debugInfo += event.id + ': hoursEl=' + (hoursEl ? 'FOUND' : 'NULL') + ', minsEl=' + (minutesEl ? 'FOUND' : 'NULL') + ', secsEl=' + (secondsEl ? 'FOUND' : 'NULL') + '<br>';

if (!hoursEl || !minutesEl || !secondsEl) return;

const diff = event.target - now;
if (diff <= 0) {
hoursEl.textContent = '00';
minutesEl.textContent = '00';
secondsEl.textContent = '00';
} else {
const totalSeconds = Math.floor(diff / 1000);
const hours = Math.floor(totalSeconds / 3600);
const minutes = Math.floor((totalSeconds % 3600) / 60);
const seconds = totalSeconds % 60;
hoursEl.textContent = hours.toString().padStart(2, '0');
minutesEl.textContent = minutes.toString().padStart(2, '0');
secondsEl.textContent = seconds.toString().padStart(2, '0');
debugInfo += event.id + ' countdown: ' + hours + 'h ' + minutes + 'm ' + seconds + 's<br>';
}
});

document.getElementById('debug').innerHTML = debugInfo;
}

updateCountdowns();
setInterval(updateCountdowns, 1000);
</script>
</body>
</html>
