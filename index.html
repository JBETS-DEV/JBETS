<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Countdown Test</title>
<style>
body { background: #080b12; color: white; font-family: Inter, sans-serif; padding: 20px; }
.countdown-box { background: rgba(20,25,35,0.95); border: 1px solid #d4af37; border-radius: 10px; padding: 20px; margin: 10px; display: inline-block; }
.countdown-value { font-size: 2rem; font-weight: bold; color: #d4af37; }
</style>
</head>
<body>
<h1>🏆 Countdown Test</h1>

<div class="countdown-box">
<div>🏀 NBA Finals</div>
<span class="countdown-value" id="nba-hours">--</span>:<span class="countdown-value" id="nba-minutes">--</span>:<span class="countdown-value" id="nba-seconds">--</span>
<div id="nba-status">Loading...</div>
</div>

<div class="countdown-box">
<div>🏒 Stanley Cup</div>
<span class="countdown-value" id="nhl-hours">--</span>:<span class="countdown-value" id="nhl-minutes">--</span>:<span class="countdown-value" id="nhl-seconds">--</span>
</div>

<div class="countdown-box">
<div>🎾 French Open</div>
<span class="countdown-value" id="fo-hours">--</span>:<span class="countdown-value" id="fo-minutes">--</span>:<span class="countdown-value" id="fo-seconds">--</span>
</div>

<div class="countdown-box">
<div>⚽ World Cup 2026</div>
<span class="countdown-value" id="wc-hours">--</span>:<span class="countdown-value" id="wc-minutes">--</span>:<span class="countdown-value" id="wc-seconds">--</span>
</div>

<script>
const countdownEvents = [
{ id: 'nba', target: new Date('2026-06-03T20:30:00-04:00'), name: 'NBA Finals G1' },
{ id: 'nhl', target: new Date('2026-06-04T20:00:00-04:00'), name: 'Stanley Cup G2' },
{ id: 'fo', target: new Date('2026-06-06T11:00:00+02:00'), name: 'French Open SF' },
{ id: 'wc', target: new Date('2026-06-11T17:00:00-05:00'), name: 'World Cup 2026' }
];

function updateCountdowns() {
const now = new Date();
countdownEvents.forEach(event => {
const hoursEl = document.getElementById(event.id + '-hours');
const minutesEl = document.getElementById(event.id + '-minutes');
const secondsEl = document.getElementById(event.id + '-seconds');
if (!hoursEl || !minutesEl || !secondsEl) return;
const diff = event.target - now;
if (diff <= 0) {
hoursEl.textContent = '00';
minutesEl.textContent = '00';
secondsEl.textContent = '00';
} else {
const totalSeconds = Math.floor(diff / 1000);
const hours = Math.floor(totalSeconds / 3600);
const minutes = Math.floor((totalSeconds % 3600) / 60);
const seconds = totalSeconds % 60;
hoursEl.textContent = hours.toString().padStart(2, '0');
minutesEl.textContent = minutes.toString().padStart(2, '0');
secondsEl.textContent = seconds.toString().padStart(2, '0');
}
});
}

updateCountdowns();
setInterval(updateCountdowns, 1000);
</script>
</body>
</html>
